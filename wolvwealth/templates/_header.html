<header class="fixed w-screen z-50">
    <nav class="px-5">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="{{ url_for('show_landing') }}" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="{{ url_for('static', filename='img/logo.png') }}" class="h-8" alt="WolvWealth Logo" />
                <span
                    class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white ubuntu">WolvWealth</span>
            </a>
            <button id="toggleButton" data-collapse-toggle="navbar-default" type="button"
                class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-white rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
                aria-controls="navbar-default" aria-expanded="false">
                <span class="sr-only">Open main menu</span>
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 17 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M1 1h15M1 7h15M1 13h15" />
                </svg>
            </button>
            <div class="hidden w-full sm:flex sm:w-auto" id="navbar-default">
                <ul
                    class="font-medium flex flex-col items-center p-4 sm:p-0 mt-4 sm:mt-0 border border-[#cccccc] rounded-lg sm:flex-row sm:space-x-8 sm:border-0 bg-transparent">
                    {% if user.is_authenticated %}
                    <li>
                        <a href="{{ url_for('show_optimizer') }}"
                            class="block py-2 px-3 text-white rounded hover:bg-gray-100 sm:hover:bg-transparent sm:border-0 sm:hover:text-blue-700 sm:p-0 dark:text-white sm:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white sm:dark:hover:bg-transparent">Optimize</a>
                    </li>
                    <li>
                        <a href="{{ url_for('show_account') }}"
                            class="block py-2 px-3 text-white rounded hover:bg-gray-100 sm:hover:bg-transparent sm:border-0 sm:hover:text-blue-700 sm:p-0 dark:text-white sm:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white sm:dark:hover:bg-transparent">Account</a>
                    </li>
                    <li>
                        <form action="{{ url_for('logout') }}" method="post">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit"
                                class="block py-2 px-3 text-white rounded hover:bg-gray-100 sm:hover:bg-transparent sm:border-0 sm:hover:text-blue-700 sm:p-0 dark:text-white sm:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white sm:dark:hover:bg-transparent">Logout</button>
                        </form>
                    </li>
                    {% else %}
                    <li>
                        <a href="{{ url_for('show_login') }}"
                            class="block py-2 px-3 text-white rounded hover:bg-gray-100 sm:hover:bg-transparent sm:border-0 sm:hover:text-blue-700 sm:p-0 dark:text-white sm:dark:hover:text-blue-500 dark:hover:bg-gray-700 dark:hover:text-white sm:dark:hover:bg-transparent">Login</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
