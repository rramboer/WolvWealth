# pycodestyle is the one tool in the toolchain that reads neither pyproject.toml
# nor command-line defaults from it, so its settings live here instead of being
# repeated as flags in CONTRIBUTING.md and the CI workflow.
[pycodestyle]
max-line-length = 120
# pycodestyle's own defaults, plus E203. Black formats a slice as
# `tickers[i : i + CHUNK_SIZE]`, which E203 reports as "whitespace before ':'";
# PEP 8 explicitly says to treat the slice colon as a binary operator, so black
# is right and E203 is the outlier. Black owns formatting here either way.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203
