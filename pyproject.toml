[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wolvwealth"
version = "1.2.0"
description = "WolvWealth: a modern portfolio optimizer web application and JSON API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WolvWealth Team" }]
dependencies = [
    "flask>=3.0",
    "bcrypt>=4.0",
    "pandas>=2.0",
    "pyportfolioopt>=1.5",
    "cvxpy>=1.4",
    "yfinance>=0.2.36",
    "gunicorn>=21.0",
]

[project.urls]
Homepage = "https://github.com/rramboer/WolvWealth"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["wolvwealth"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["wolvwealth/static", "wolvwealth/js"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wolvwealth"]

[tool.coverage.report]
show_missing = true
